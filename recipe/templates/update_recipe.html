{% extends "base.html" %}
{% block start %}

<main class="flex-fill d-flex align-items-center">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow border-0">

                    <div class="card-body p-4">

                        <h2 class="text-center text-danger fw-bold mb-4">
                            Update Recipe
                        </h2>

                        <form method="POST" enctype="multipart/form-data">
                            {% csrf_token %}

                            <!-- Recipe Name -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">
                                    Recipe Name
                                </label>

                                <input type="text"
                                       name="recipe_name"
                                       value="{{ recipe.recipe_name }}"
                                       class="form-control p-3"
                                       required>
                            </div>

                            <!-- Description -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">
                                    Recipe Description
                                </label>

                                <textarea name="recipe_description"
                                          class="form-control p-3"
                                          rows="4"
                                          required>{{ recipe.recipe_description }}</textarea>
                            </div>

                            <!-- Current Image -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">
                                    Current Image
                                </label>

                                {% if recipe.recipe_image %}
                                    <br>
                                    <img src="{{ recipe.recipe_image.url }}"
                                         width="150"
                                         class="rounded shadow">
                                {% else %}
                                    <p>No image available</p>
                                {% endif %}
                            </div>

                            <!-- New Image -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">
                                    Change Image
                                </label>

                                <input type="file"
                                       name="recipe_image"
                                       class="form-control p-3">
                            </div>

                            <!-- Button -->
                            <button type="submit"
                                    class="btn btn-danger w-100 p-3 fw-bold">
                                Update Recipe
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

{% endblock %}

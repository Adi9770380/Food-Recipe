{% extends "base.html" %}

{% block start %}
<main class="flex-fill d-flex align-items-start">

    <div class="container mt-3">

        <div class="row justify-content-center">

            <div class="col-md-5">

                <div class="card shadow border-0">

                    <div class="card-body p-4">

                        <h1 class="text-center fw-bold mb-4 text-danger">
                            Signup
                        </h1>

                        <form method="POST">

                            {% csrf_token %}

                            <!-- Username -->
                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Username
                                </label>

                                <input type="text"
                                       name="username"
                                       class="form-control p-3"
                                       placeholder="Enter username">

                            </div>

                            <!-- Email -->
                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Email
                                </label>

                                <input type="email"
                                       name="email"
                                       class="form-control p-3"
                                       placeholder="Enter email">

                            </div>

                            <!-- Password -->
                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Password
                                </label>

                                <input type="password"
                                       name="password"
                                       class="form-control p-3"
                                       placeholder="Enter password">

                            </div>

                            <!-- Confirm Password -->
                            <div class="mb-4">

                                <label class="form-label fw-bold">
                                    Confirm Password
                                </label>

                                <input type="password"
                                       name="confirm_password"
                                       class="form-control p-3"
                                       placeholder="Confirm password">

                            </div>

                            <!-- Button -->
                            <button class="btn btn-danger w-100 py-2 fw-bold">
                                Create Account
                            </button>

                            <!-- Login Link -->
                            <p class="text-center mt-3 text-dark">

                                Already have an account?

                                <a href="{% url 'login_page' %}"
                                   class="text-danger fw-bold text-decoration-none">

                                    Login

                                </a>

                            </p>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

{% endblock %}

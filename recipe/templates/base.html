{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>RecipeHub</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

    body{
        background-color: #fcc83b;
    }

    .hero-section{
        padding-top: 20px;
        padding-bottom: 20px;
    }

    .hero-section h1,
    .hero-section p{
        color: white;
    }

    .navbar{
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        padding: 14px 0;
    }

    footer{
        box-shadow: 0 -4px 10px rgba(0,0,0,0.2);
    }

    .nav-link{
        font-weight: 500;
        transition: 0.3s;
    }

    .nav-link:hover{
        color: #ffd166 !important;
    }

    </style>

</head>

<body class="d-flex flex-column min-vh-100">

<!-- HEADER -->
<header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">

        <div class="container">

            <a class="navbar-brand fw-bold fs-2 text-white"
               href="{% url 'home' %}">
                RecipeHub
            </a>

            <div class="ms-auto">

                <a class="nav-link text-white d-inline me-3"
                   href="{% url 'home' %}">
                   Home
                </a>

                <a class="nav-link text-white d-inline me-3"
                   href="{% url 'add_recipe' %}">
                   Add Recipe
                </a>

                <a class="nav-link text-white d-inline me-3"
                   href="{% url 'about' %}">
                   About
                </a>

                {% if request.user.is_authenticated %}

                <a class="btn btn-warning btn-sm px-3"
                   href="{% url 'logout_page' %}">
                    Logout
                </a>

                {% else %}

                <a class="btn btn-outline-light btn-sm me-2 px-3"
                   href="{% url 'signup' %}">
                    Signup
                </a>

                <a class="btn btn-warning btn-sm px-3"
                   href="{% url 'login_page' %}">
                    Login
                </a>

                {% endif %}

            </div>

        </div>

    </nav>

</header>

<!-- MAIN -->
<main class="flex-fill">

    {% block start %}
    {% endblock %}

</main>

<!-- FOOTER -->
<footer class="bg-danger text-white text-center py-3 mt-5">

    <div class="container">

        <p class="mb-0 text-white">
            © 2026 RecipeHub • Made with ❤️ for Food Lovers
        </p>

    </div>

</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
